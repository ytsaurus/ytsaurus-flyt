service_name: "simple-wordcount"

flink_version: "1.20.1"
runtime_python_version: "3.10"
java_version: "11"

proxy: "http://localhost:50005"
yt_ui_base_url: "http://localhost:50004"

pool: "default"
preset: "micro"

squashfs_layer_paths:
  - "//sys/flink/flyt-flink120-py310.squashfs"
squashfs_layer_delivery: "sandbox_unpack"
unsquashfs_path: "//sys/flink/unsquashfs"

yt_client_config:
  proxy:
    enable_proxy_discovery: false